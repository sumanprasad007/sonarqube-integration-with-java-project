name: CI/CD workflow for Maven Build and Sonar Code scan
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 11
      uses: actions/setup-java@v2
      with:
        distribution: 'adopt'
        java-version: '11'

    - name: Build with Maven
      run: mvn install -f MyWebApp/pom.xml

    - name: Verify Sonar secrets
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      run: |
        test -n "$SONAR_TOKEN" || { echo "::error::SONAR_TOKEN is missing"; exit 1; }
        test -n "$SONAR_HOST_URL" || { echo "::error::SONAR_HOST_URL is missing"; exit 1; }
        SONAR_HOST_URL="${SONAR_HOST_URL%/}"
        curl --connect-timeout 10 --max-time 30 --fail --silent --show-error \
          --user "$SONAR_TOKEN:" \
          "$SONAR_HOST_URL/api/authentication/validate" |
          jq -e '.valid == true' >/dev/null
        echo "Sonar host is reachable and the token is valid."

    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@master
      with:
        projectBaseDir: .
        args: >
          -Dsonar.organization=my-org
          -Dsonar.projectKey=my-Java-web-app
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Check the Quality Gate status.
    - name: SonarQube Quality Gate check
      id: sonarqube-quality-gate-check
      uses: sonarsource/sonarqube-quality-gate-action@master
